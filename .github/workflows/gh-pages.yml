name: Deploy stories to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install root deps
        run: bun install

      - name: Build library
        run: bun run build

      - name: Install ladle deps
        run: bun install
        working-directory: ladle

      - name: Build stories
        run: bun run build
        working-directory: ladle

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ladle/build
