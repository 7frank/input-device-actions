name: Deploy stories to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install root deps
        run: bun install

      - name: Build library
        run: bun run build

      - name: Install ladle deps
        run: bun install
        working-directory: ladle

      - name: Build stories
        run: bun run build
        working-directory: ladle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ladle/build

      - uses: actions/deploy-pages@v4
        id: deploy
